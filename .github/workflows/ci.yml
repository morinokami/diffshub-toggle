name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Takumi Guard
        uses: flatt-security/setup-takumi-guard-npm@9a5d797c2085b6326d3a2985c08e3a114b9b88c1 # v1.1.1

      - name: Setup nub
        uses: nubjs/setup-nub@21b317c170eee658503996209cf87b63481be35a # v0.5.0
        with:
          cache: true

      - name: Install dependencies
        run: nub install --frozen-lockfile

      - name: Run lint
        run: nub run lint

      - name: Run format check
        run: nub run fmt:check

      - name: Run tests
        run: nub run test

      - name: Build icons
        run: nub run build:icons

      - name: Check icons are up to date
        run: git diff --exit-code extension/icons

      - name: Build extension
        run: nub run build
